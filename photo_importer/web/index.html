<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Importer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='26' height='19' rx='4' fill='%23e9b44c'/%3E%3Crect x='11' y='4' width='10' height='6' rx='2' fill='%23e9b44c'/%3E%3Ccircle cx='16' cy='17.5' r='6' fill='%2317181b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <div class="brand">Photo Importer</div>
  <label class="field">
    <span>From</span>
    <select id="source"></select>
  </label>
  <div class="field grow">
    <span>To library</span>
    <button id="library" class="path" title="Change the library folder"></button>
  </div>
  <label class="field">
    <span>Subfolder</span>
    <input id="subfolder" type="text" spellcheck="false" placeholder="none" title="Photos are placed in this subfolder inside each event folder. Leave empty to put them directly in the event folder.">
  </label>
  <button id="rescan" class="btn">Rescan</button>
</header>

<div id="summary"></div>
<main id="main"></main>

<footer id="bottom" hidden>
  <div id="bottom-text"></div>
  <div class="spacer"></div>
  <button id="bulk-separate" class="link" hidden>Keep the rest separate</button>
  <button id="import" class="btn primary"></button>
</footer>

<div id="modal" hidden></div>
<div id="lightbox" hidden></div>
<script src="/app.js"></script>
</body>
</html>
